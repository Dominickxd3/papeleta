<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <meta name="theme-color" content="#0b1220" />
  <link rel="icon" type="image/png" href="/img/logo-gp.png" />
  <link rel="apple-touch-icon" href="/img/logo-gp.png" />
  <link rel="manifest" href="/manifest.webmanifest" />
  <title>Papeletas Permiso</title>

  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"/>

  <!-- Base -->
  <link rel="stylesheet" href="../css/base/variables.css">
  <link rel="stylesheet" href="../css/base/reset.css">

  <!-- Layout -->
  <link rel="stylesheet" href="../css/layout/sidebar.css">
  <link rel="stylesheet" href="../css/layout/topbar.css">

  <!-- Components -->
  <link rel="stylesheet" href="../css/components/modal.css">
  <link rel="stylesheet" href="../css/components/table.css">

  <!-- Page -->
  <link rel="stylesheet" href="../css/pages/permisos.page.css">

  <!-- (OPCIONAL) Slide moderno -->
  <!-- <link rel="stylesheet" href="../css/slides/papeleta-slide.css"> -->
</head>

<body>
  <!-- Sidebar (Drawer) -->
  <aside class="sidebar" id="sidebar">
    <div class="sb-top">
      <a class="sb-brand" href="dashboard.html">
        <img src="../img/logo-gp.png" alt="Grupo Pecuario" class="sb-logo" onerror="this.style.display='none'">
        <div class="sb-brand-text">
          <div class="sb-brand-title">Grupo Pecuario</div>
          <div class="sb-brand-sub">Sistema GP</div>
        </div>
      </a>

      <button class="sb-close" id="sbClose" type="button" aria-label="Cerrar menú">
        <i class="fa-solid fa-xmark"></i>
      </button>
    </div>

    <div class="sb-user">
      <div class="sb-avatar"><i class="fa-solid fa-user"></i></div>
      <div class="sb-user-meta">
        <div class="sb-name" id="sbUserName">Usuario</div>
        <div class="sb-role" id="sbUserRole">ROL</div>
      </div>
    </div>

    <nav class="sb-menu">
      <a href="dashboard.html" class="sb-item" id="mDashboard">
        <i class="fa-solid fa-house"></i><span>Dashboard</span>
      </a>

      <a href="formulario-papeleta.html" class="sb-item" id="mNueva">
        <i class="fa-solid fa-circle-plus"></i><span>Nueva Papeleta</span>
      </a>

      <a href="permisos.html" class="sb-item" id="mPermisos">
        <i class="fa-solid fa-file-lines"></i><span>Papeletas</span>
      </a>

      <a href="trabajadores.html" class="sb-item" id="mTrabajadores">
        <i class="fa-solid fa-users"></i><span>Trabajadores</span>
      </a>

      <a href="administrar.html" class="sb-item" id="mAdministrar">
        <i class="fa-solid fa-user-shield"></i><span>Administrar</span>
      </a>

      <a href="perfil.html" class="sb-item" id="mPerfil">
        <i class="fa-solid fa-user-gear"></i><span>Perfil</span>
      </a>
    </nav>

    <div class="sb-footer">
      <button class="sb-item sb-logout" id="btnSidebarLogout" type="button">
        <i class="fa-solid fa-right-from-bracket"></i><span>Salir</span>
      </button>

      <div class="sb-toggle">
        <div class="left">
          <i class="fa-solid fa-moon"></i><span>Modo oscuro</span>
        </div>
        <label class="switch">
          <input type="checkbox" id="themeToggle">
          <span class="slider"></span>
        </label>
      </div>
    </div>
  </aside>

  <div class="overlay" id="overlay"></div>

  <!-- Topbar -->
  <header class="topbar">
    <button class="hamburger" id="hamburger" type="button" aria-label="Abrir menú">
      <i class="fa-solid fa-bars"></i>
    </button>

    <div class="topbar-right">
      <div class="top-user">
        <div class="name" id="userName">Usuario</div>
        <div class="role" id="userRole">ROL</div>
      </div>

      <button class="btn-logout" id="btnLogout" type="button">
        <i class="fa-solid fa-right-from-bracket"></i>
        <span>Salir</span>
      </button>
    </div>
  </header>

  <!-- Main -->
  <main class="main permisos-main">
    <section class="contenedor-permisos">

      <div class="card-permisos">
        <div class="header-permisos modern-header">
          <div class="titulo">
            <i class="fa-solid fa-clipboard-list"></i>
            <h2>Gestión de Papeletas</h2>
          </div>

          <div class="acciones-top modern-actions">
            <!-- ESTE botón lo usa tu controller para abrir modal -->
            <button id="btnNueva" class="btn btn-success" type="button">
              <i class="fa-solid fa-plus"></i> Nueva Papeleta
            </button>

            <button id="btnAprobar" class="btn btn-success soft" type="button" disabled>
              <i class="fa-solid fa-check"></i> Aprobar
            </button>
            <button id="btnRechazar" class="btn btn-danger soft" type="button" disabled>
              <i class="fa-solid fa-xmark"></i> Rechazar
            </button>

            <button id="btnEditar" class="btn btn-warning" type="button" disabled>
              <i class="fa-solid fa-pen"></i> Editar
            </button>
            <button id="btnEliminar" class="btn btn-danger" type="button" disabled>
              <i class="fa-solid fa-trash"></i> Eliminar
            </button>

            <button id="btnExportar" class="btn btn-info" type="button">
              <i class="fa-solid fa-file-export"></i> Exportar
            </button>
            <button id="btnActualizar" class="btn btn-secondary" type="button">
              <i class="fa-solid fa-rotate"></i> Actualizar
            </button>
          </div>
        </div>

        <div class="filtros-permisos modern-filters">
          <label class="chk">
            <input type="checkbox" id="chkEliminados">
            Mostrar anulados
          </label>

          <select id="filtroArea">
            <option value="">Todas las áreas</option>
          </select>

          <div class="buscador modern-search">
            <input type="text" id="txtBuscar" placeholder="Buscar por trabajador, DNI, cargo, motivo...">
            <i class="fa-solid fa-magnifying-glass"></i>
          </div>
        </div>

        <div class="tabs-permisos" id="tabsPermisos">
          <button class="tab active" id="tabTodas" data-filter="todas" type="button">Todas</button>
          <button class="tab" id="tabPendientes" data-filter="pendientes" type="button">Pendientes</button>
          <button class="tab" id="tabAprobadas" data-filter="aprobadas" type="button">Aprobadas</button>
          <button class="tab" id="tabRechazadas" data-filter="rechazadas" type="button">Rechazadas</button>
        </div>
      </div>

      <div class="card-tabla">
        <div class="tabla-wrap">
          <table class="tabla" id="tablaPermisos">
            <thead>
              <tr>
                <th>N°</th>
                <th>Fecha</th>
                <th>Trabajador</th>
                <th>Cargo</th>
                <th>Área</th>
                <th>Motivo</th>
                <th>Salida</th>
                <th>Retorno</th>
                <th>Total</th>
                <th>Estado</th>
                <th>Acciones</th>
              </tr>
            </thead>

            <tbody id="tbodyPermisos">
              <tr>
                <td colspan="11" style="text-align:center; padding: 28px;">
                  <i class="fa-solid fa-circle-notch fa-spin"></i>
                  <div style="margin-top:8px;">Cargando papeletas...</div>
                </td>
              </tr>
            </tbody>
          </table>
        </div>

        <div class="paginacion modern-pagination">
          <div class="info" id="lblInfo">Mostrando 0-0 de 0 registros</div>

          <div class="controles">
            <button id="btnFirst" aria-label="Primera" type="button">&laquo;</button>
            <button id="btnPrev" aria-label="Anterior" type="button">&lsaquo;</button>
            <div id="pags"></div>
            <button id="btnNext" aria-label="Siguiente" type="button">&rsaquo;</button>
            <button id="btnLast" aria-label="Última" type="button">&raquo;</button>
          </div>

          <div class="por-pagina">
            <select id="selPageSize">
              <option value="10" selected>10 por página</option>
              <option value="25">25 por página</option>
              <option value="50">50 por página</option>
            </select>
          </div>
        </div>
      </div>

      <!-- Cards movil -->
      <div id="mobileCards" class="mobile-cards"></div>

      <!-- MODAL: Formulario Nueva/Editar (CORRECTAMENTE dentro del body y antes de scripts) -->
      <div id="modalPapeleta" class="gp-modal" aria-hidden="true">
        <div class="gp-modal-backdrop" data-close="modal"></div>

        <div class="gp-modal-dialog" role="dialog" aria-modal="true" aria-label="Formulario Papeleta">
          <div class="gp-modal-header">
            <h3 id="modalPapeletaTitle">Papeleta</h3>
            <button class="gp-modal-close" type="button" data-close="modal" aria-label="Cerrar">
              <i class="fa-solid fa-xmark"></i>
            </button>
          </div>

          <iframe id="modalPapeletaFrame" class="gp-modal-frame" src="about:blank"></iframe>
        </div>
      </div>

      <!-- (OPCIONAL) SLIDE MODERNO -->
      <!--
      <div id="slideOverlay" class="slide-overlay"></div>
      <aside id="slidePapeleta" class="slide-panel" aria-hidden="true">
        ... tu formulario slide aquí ...
      </aside>
      -->

    </section>
  </main>

  <!-- SweetAlert2 -->
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

  <!-- API -->
  <script src="../js/api/api-client.js"></script>
  <script src="../js/api/auth.api.js"></script>
  <script src="../js/api/usuarios.api.js"></script>
  <script src="../js/api/trabajadores.api.js"></script>
  <script src="../js/api/papeletas.api.js"></script>
  <script src="../js/api/catalogos.api.js"></script>
  <script src="../js/api/health.api.js"></script>

  <!-- Utils -->
  <script src="../js/utils/formatters.js"></script>
  <script src="../js/utils/validators.js"></script>
  <script src="../js/utils/notifications.js"></script>

  <!-- Services -->
  <script src="../js/services/permisos.service.js"></script>
  <script src="../js/services/trabajadores.service.js"></script>
  <script src="../js/services/ui-selectors.service.js"></script>

  <!-- View + Controller -->
  <script src="../js/views/permisos.view.js"></script>
  <script src="../js/controllers/permisos.controller.js"></script>

  <!-- Sidebar + Entrypoint -->
  <script src="../js/sidebar.js"></script>
  <script src="../js/pages/permisos.page.js"></script>
  
</body>
</html>
