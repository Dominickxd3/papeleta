<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <meta name="theme-color" content="#0b1220" />
  <link rel="icon" type="image/png" href="/img/logo-gp.png" />
  <link rel="apple-touch-icon" href="/img/logo-gp.png" />
  <link rel="manifest" href="/manifest.webmanifest" />
  <title>Perfil - Sistema GP</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"/>
  <link rel="stylesheet" href="../css/base/variables.css">
  <link rel="stylesheet" href="../css/base/reset.css">
  <link rel="stylesheet" href="../css/layout/sidebar.css">
  <link rel="stylesheet" href="../css/layout/topbar.css">
  <link rel="stylesheet" href="../css/pages/perfil.page.css">
</head>
<body>
  <aside class="sidebar" id="sidebar">
    <div class="sb-top">
      <a class="sb-brand" href="dashboard.html">
        <img src="../img/logo-gp.png" alt="Grupo Pecuario" class="sb-logo" onerror="this.style.display='none'">
        <div class="sb-brand-text">
          <div class="sb-brand-title">GrupoPecuario</div>
          <div class="sb-brand-sub">Sistema GP</div>
        </div>
      </a>
      <button class="sb-close" id="sbClose" type="button" aria-label="Cerrar menú"><i class="fa-solid fa-xmark"></i></button>
    </div>

    <div class="sb-user">
      <div class="sb-avatar"><i class="fa-solid fa-user"></i></div>
      <div class="sb-user-meta">
        <div class="sb-name" id="sbUserName">Usuario</div>
        <div class="sb-role" id="sbUserRole">ROL</div>
      </div>
    </div>

    <nav class="sb-menu">
      <a href="dashboard.html" class="sb-item" id="mDashboard"><i class="fa-solid fa-house"></i><span>Dashboard</span></a>
      <a href="formulario-papeleta.html" class="sb-item" id="mNueva"><i class="fa-solid fa-circle-plus"></i><span>Nueva Papeleta</span></a>
      <a href="permisos.html" class="sb-item" id="mPermisos"><i class="fa-solid fa-file-lines"></i><span>Papeletas</span></a>
      <a href="trabajadores.html" class="sb-item" id="mTrabajadores"><i class="fa-solid fa-users"></i><span>Trabajadores</span></a>
      <a href="administrar.html" class="sb-item" id="mAdministrar"><i class="fa-solid fa-user-shield"></i><span>Administrar</span></a>
      <a href="reporte.html" class="sb-item" id="mReportes"><i class="fa-solid fa-chart-line"></i><span>Reportes</span></a>
      <a href="perfil.html" class="sb-item" id="mPerfil"><i class="fa-solid fa-user-gear"></i><span>Perfil</span></a>
    </nav>

    <div class="sb-footer">
      <button class="sb-item sb-logout" id="btnSidebarLogout" type="button"><i class="fa-solid fa-right-from-bracket"></i><span>Salir</span></button>
      <div class="sb-toggle">
        <div class="left">
          <i class="fa-solid fa-moon"></i><span>Modo oscuro</span>
        </div>
        <label class="switch">
          <input type="checkbox" id="themeToggle">
          <span class="slider"></span>
        </label>
      </div>
    </div>
  </aside>

  <div class="overlay" id="overlay"></div>

  <header class="topbar">
    <button class="hamburger" id="hamburger" type="button" aria-label="Abrir menú"><i class="fa-solid fa-bars"></i></button>
    <div class="topbar-right">
      <div class="top-user">
        <div class="name" id="userName">Usuario</div>
        <div class="role" id="userRole">ROL</div>
      </div>
      <button class="btn-logout" id="btnLogout" type="button"><i class="fa-solid fa-right-from-bracket"></i><span>Salir</span></button>
    </div>
  </header>

  <main class="profile-main">
    <section class="card profile-card">
      <h2>Mi Perfil</h2>
      <div class="profile-grid">
        <div class="photo-col">
          <img id="profilePhoto" src="../img/logo-gp.png" alt="Foto de perfil" class="profile-photo" onerror="this.onerror=null;this.src='../img/logo-gp.png';" />
          <input type="file" id="photoInput" accept="image/*" />
          <button id="btnUploadPhoto" type="button" class="btn">Guardar foto</button>
          <small>Máximo 2MB</small>
        </div>

        <form id="profileForm" class="form-col">
          <label>Usuario</label>
          <input id="perfilUsuario" type="text" readonly />

          <label>Nombre completo</label>
          <input id="perfilNombre" type="text" required />

          <label>Email</label>
          <input id="perfilEmail" type="email" readonly />

          <label>Rol</label>
          <input id="perfilRol" type="text" readonly />

          <button type="submit" class="btn">Guardar nombre</button>
        </form>
      </div>
    </section>

  </main>

  <script src="../js/api/api-client.js"></script>
  <script src="../js/api/usuarios.api.js"></script>
  <script src="../js/sidebar.js"></script>
  <script src="../js/controllers/perfil.controller.js"></script>
</body>
</html>
